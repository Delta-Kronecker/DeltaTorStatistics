<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeltaTor — Statistics</title>
  <meta name="description" content="DeltaTor installation and connection statistics">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2308080a'/><text y='.8em' x='.05em' font-size='80' fill='%23d4af37'>Δ</text></svg>">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">Δ</span>
        <span class="brand-name">DeltaTor</span>
        <span class="brand-sep">/</span>
        <span class="brand-sub">Statistics</span>
      </div>
    </div>
  </header>

  <main class="page">

    <section class="tiles">
      <div class="tile">
        <div class="tile-label">Android Installs <span class="tile-version">v2.1.3 &amp; newer</span></div>
        <div class="tile-value" id="androidInstalls">—</div>
      </div>

      <div class="tile">
        <div class="tile-label">Android Connections <span class="tile-version">v2.1.3 &amp; newer</span></div>
        <div class="tile-value" id="androidConnects">—</div>
      </div>

      <div class="tile">
        <div class="tile-label">Windows Installs <span class="tile-tag soon">soon</span></div>
        <div class="tile-value tile-soon">Coming&nbsp;Soon</div>
      </div>

      <div class="tile">
        <div class="tile-label">Windows Connections <span class="tile-tag soon">soon</span></div>
        <div class="tile-value tile-soon">Coming&nbsp;Soon</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Installs &amp; Connections Over Time</h2>
        </div>
        <div class="ranges" id="ranges">
          <button class="range active" data-days="1">24H</button>
          <button class="range" data-days="7">7D</button>
          <button class="range" data-days="30">30D</button>
          <button class="range" data-days="90">90D</button>
          <button class="range" data-days="all">ALL</button>
        </div>
      </div>
      <div class="chart-box">
        <canvas id="chart"></canvas>
        <div class="chart-empty" id="chartEmpty">Not enough snapshots in this range yet.<br><small>A snapshot is collected every hour.</small></div>
      </div>
      <div class="legend">
        <span class="lg lg-gold"></span> Installs
        <span class="lg lg-line"></span> Connections
        <span class="legend-updated" id="lastUpdate">—</span>
      </div>
    </section>

  </main>

  <div id="errorBox" class="error-box hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
