name: Collect stats

on:
  schedule:
    # اجرا هر ۶ ساعت به وقت تهران (UTC+3:30)
    - cron: "30 20 * * *"   # 00:00 تهران
    - cron: "30 2 * * *"    # 06:00 تهران
    - cron: "30 8 * * *"    # 12:00 تهران
    - cron: "30 14 * * *"   # 18:00 تهران
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: 6-hourly stats snapshot [skip ci]"
            git pull --rebase origin main
            git push
          fi
